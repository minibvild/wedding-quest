<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Свадебный Квест</title>
  <!-- Telegram Web App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- библиотека Конфетти (хлопушка) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: rgba(28, 28, 30, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f5f5f7;
      --text-secondary: #8e8e93;
      --accent-color: #0a84ff;
      --success-bg: rgba(48, 209, 88, 0.15);
      --success-border: #30d158;
      --success-text: #30d158;
      --error-bg: rgba(255, 69, 58, 0.15);
      --error-border: #ff453a;
      --error-text: #ff453a;
      --gold-accent: #d4af37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Мобильный контейнер / Карточка */
    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100dvh;
      max-height: 880px;
      padding: 16px 20px 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Верхний инфо-блок */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .step-badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .description {
      font-size: 13px;
      line-height: 1.35;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* Карточка с иллюстрацией */
    .media-card {
      width: 100%;
      flex: 1;
      max-height: 270px;
      min-height: 180px;
      margin: 12px 0;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      background: #1c1c1e;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .media-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    /* Нижний интерактивный блок */
    .interactive-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .question {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 2px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Кнопки ответов Apple style */
    .btn-option {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .btn-option:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.12);
    }

    .btn-option.correct {
      background: var(--success-bg) !important;
      border-color: var(--success-border) !important;
      color: var(--success-text) !important;
      font-weight: 600;
    }

    .btn-option.wrong {
      background: var(--error-bg) !important;
      border-color: var(--error-border) !important;
      color: var(--error-text) !important;
    }

    /* Синяя кнопка продолжить */
    .next-btn {
      width: 100%;
      padding: 15px;
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px) scale(0.96);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 4px;
    }

    .next-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .next-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    /* Анимация смены кадров */
    .fade-wrapper {
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.35s cubic-bezier(0.25, 1, 0.5, 1), transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
    }

    .fade-out {
      opacity: 0;
      transform: scale(0.96);
    }

    /* Дизайн финала: Подарочный сертификат Lumísfera */
    .cert-card {
      width: 100%;
      background: linear-gradient(145deg, #18181a, #0b0b0c);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 18px;
      padding: 18px 16px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .cert-brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .cert-title {
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--gold-accent);
      text-transform: uppercase;
      font-weight: 600;
    }

    .cert-text {
      font-size: 12px;
      line-height: 1.4;
      color: #c7c7cc;
      margin-top: 2px;
    }

    .cert-badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 20px;
      color: #e5c158;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="fade-wrapper" id="fadeWrapper">
    <!-- Шапка -->
    <div class="header">
      <span class="step-badge" id="stepBadge">Шаг 1 из 7</span>
      <h1 class="title" id="stepTitle">Заголовок</h1>
      <p class="description" id="stepDesc">Описание шага...</p>
    </div>

    <!-- Иллюстрация -->
    <div class="media-card">
      <img id="stepImg" src="" alt="Иллюстрация">
    </div>

    <!-- Вопрос и интерактив -->
    <div class="interactive-area">
      <div class="question" id="stepQuestion">Вопрос...</div>
      <div class="options" id="optionsContainer"></div>
      <button class="next-btn" id="nextBtn" onclick="nextStep()">Продолжить ➔</button>
    </div>
  </div>
</div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  // Арты в атмосферном темном графическом стиле
  const steps = [
    {
      badge: "Шаг 1 из 7 • Уральск",
      title: "Глава 1: Первое чувство",
      desc: "Уральск. Город, где пересеклись два жизненных пути.",
      img: "https://images.unsplash.com/photo-1514565131-fce0801e5785?w=800&auto=format&fit=crop",
      question: "Помнишь ли ты, где произошло то самое знакомство?",
      options: [
        { text: "На прогулке с общими друзьями", correct: true },
        { text: "В уютном кафе у дома", correct: false },
        { text: "Случайно на улице", correct: false }
      ]
    },
    {
      badge: "Шаг 2 из 7 • Расстояние",
      title: "Глава 2: Уфа ↔ Самара",
      desc: "Учеба, ночной город и бесконечные звонки сквозь километры.",
      img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800&auto=format&fit=crop",
      question: "Сколько примерно километров соединяло ваши города?",
      options: [
        { text: "Около 250 км", correct: false },
        { text: "Примерно 460 км", correct: true },
        { text: "Больше 800 км", correct: false }
      ]
    },
    {
      badge: "Шаг 3 из 7 • Дом",
      title: "Глава 3: Вместе в Самаре",
      desc: "Конец билетам и ожиданиям! Наконец-то общий дом и тёплые вечера.",
      img: "https://images.unsplash.com/photo-1540555700478-4be289fbecef?w=800&auto=format&fit=crop",
      question: "Что помогло быстрее всего обустроить ваш уют?",
      options: [
        { text: "Тёплые беседы, душевный чай и забота", correct: true },
        { text: "Бесконечные споры о бытовых мелочах", correct: false }
      ]
    },
    {
      badge: "Шаг 4 из 7 • Манила",
      title: "Глава 4: Филиппины & «ДА!»",
      desc: "Ночной океан, звездное небо и самый важный ответ 💍",
      img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&auto=format&fit=crop",
      question: "Какая атмосфера царила в тот незабываемый момент?",
      options: [
        { text: "Волшебный закат и полная гармония", correct: true },
        { text: "Легкий экспромт и океан эмоций", correct: true }
      ]
    },
    {
      badge: "Шаг 5 из 7 • Алматы",
      title: "Глава 5: В горах с друзьями",
      desc: "Вечерний костер, тишина гор и лучшая компания рядом.",
      img: "https://images.unsplash.com/photo-1478131143081-80f7f84ca84d?w=800&auto=format&fit=crop",
      question: "Главный ингредиент идеального похода в горы?",
      options: [
        { text: "Надежные друзья и уют у огня", correct: true }
      ]
    },
    {
      badge: "Шаг 6 из 7 • Праздник",
      title: "Глава 6: День Свадьбы 🥂",
      desc: "Рождение новой семьи при свете сотен огней!",
      img: "https://images.unsplash.com/photo-1519741497674-611481863552?w=800&auto=format&fit=crop",
      question: "Что кричим молодоженам прямо сейчас?",
      options: [
        { text: "ГОРЬКО! 🎉", correct: true }
      ]
    },
    {
      badge: "Шаг 7 из 7 • Финал",
      title: "Главный подарок! 🕯️",
      desc: "Вы прошли весь квест! Вас ждет вечер живой музыки в атмосфере тысяч свечей.",
      img: "https://images.unsplash.com/photo-1511192336575-5a79af67a629?w=800&auto=format&fit=crop",
      isFinal: true
    }
  ];

  let currentStep = 0;

  // Функция запуска "хлопушки" как в Telegram
  function triggerPopPopper() {
    // Выстрел слева
    confetti({
      particleCount: 70,
      angle: 60,
      spread: 55,
      origin: { x: 0, y: 0.8 }
    });
    // Выстрел справа
    confetti({
      particleCount: 70,
      angle: 120,
      spread: 55,
      origin: { x: 1, y: 0.8 }
    });
  }

  function renderStep() {
    const data = steps[currentStep];
    document.getElementById('stepBadge').innerText = data.badge;
    document.getElementById('stepTitle').innerText = data.title;
    document.getElementById('stepDesc').innerText = data.desc;
    document.getElementById('stepImg').src = data.img;
    
    const optionsContainer = document.getElementById('optionsContainer');
    const questionEl = document.getElementById('stepQuestion');
    const nextBtn = document.getElementById('nextBtn');
    
    optionsContainer.innerHTML = '';
    nextBtn.classList.remove('visible');

    if (data.isFinal) {
      questionEl.innerHTML = `
        <div class="cert-card">
          <div class="cert-brand">LUMÍSFERA</div>
          <div class="cert-title">Подарочный Сертификат</div>
          <p class="cert-text">Музыкальное шоу при свече тысяч огней. Погружение в атмосферу живой музыки, тепла и вдохновения.</p>
          <div class="cert-badge">✨ Билет на концерт</div>
        </div>`;
      
      // Запуск хлопушки
      triggerPopPopper();
      setTimeout(triggerPopPopper, 400);
      return;
    }

    questionEl.innerText = data.question;

    data.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'btn-option';
      btn.innerText = opt.text;
      btn.onclick = () => {
        const allBtns = optionsContainer.querySelectorAll('.btn-option');
        allBtns.forEach(b => b.disabled = true);
        
        if (opt.correct) {
          btn.classList.add('correct');
        } else {
          btn.classList.add('wrong');
        }
        nextBtn.classList.add('visible');
      };
      optionsContainer.appendChild(btn);
    });
  }

  function nextStep() {
    if (currentStep < steps.length - 1) {
      const wrapper = document.getElementById('fadeWrapper');
      wrapper.classList.add('fade-out');
      
      setTimeout(() => {
        currentStep++;
        renderStep();
        wrapper.classList.remove('fade-out');
      }, 350);
    }
  }

  renderStep();
</script>
</body>
</html>
