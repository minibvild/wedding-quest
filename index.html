<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Свадебный Квест</title>
  <!-- Telegram Web App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- библиотека Конфетти (хлопушка) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: rgba(28, 28, 30, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f5f5f7;
      --text-secondary: #8e8e93;
      --accent-color: #0a84ff;
      --success-bg: rgba(48, 209, 88, 0.15);
      --success-border: #30d158;
      --success-text: #30d158;
      --error-bg: rgba(255, 69, 58, 0.15);
      --error-border: #ff453a;
      --error-text: #ff453a;
      --gold-accent: #d4af37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      min-height: 100dvh;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Мобильный контейнер */
    .app-container {
      width: 100%;
      max-width: 420px;
      min-height: 100dvh;
      padding: 16px 20px 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Верхний инфо-блок */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .step-badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .description {
      font-size: 13px;
      line-height: 1.35;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* Карточка с иллюстрацией (Квест и Сертификаты) */
    .media-card {
      width: 100%;
      height: 280px;
      margin: 12px 0;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      background: #000000;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .media-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Полноэкранный текстовый блок для transition-экранов */
    .intro-text-block {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px 10px;
      width: 100%;
    }

    .intro-text-block h2 {
      font-size: 24px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-main);
      letter-spacing: -0.3px;
      margin-bottom: 24px;
    }

    /* Финальный экран с целующим смайликом */
    .kiss-screen {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 110px;
      line-height: 1;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* Нижний интерактивный блок */
    .interactive-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .question {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 2px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Кнопки ответов */
    .btn-option {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-option:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.12);
    }

    .btn-option.correct {
      background: var(--success-bg) !important;
      border-color: var(--success-border) !important;
      color: var(--success-text) !important;
      font-weight: 600;
    }

    .btn-option.wrong {
      background: var(--error-bg) !important;
      border-color: var(--error-border) !important;
      color: var(--error-text) !important;
    }

    /* Синяя главная кнопка */
    .next-btn {
      width: 100%;
      padding: 15px;
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px) scale(0.96);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 4px;
    }

    .next-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .next-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    /* Анимация смены кадров */
    .fade-wrapper {
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.35s ease, transform 0.35s ease;
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
    }

    .fade-out {
      opacity: 0;
      transform: scale(0.96);
    }

    /* Стили для скретч-карты */
    .scratch-container {
      position: relative;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      background: #18181a;
      margin: 12px 0;
    }

    .scratch-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .scratch-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: none;
    }

    /* Стили для Пазла 4x5 */
    .puzzle-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 3px;
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
      padding: 3px;
      transition: gap 0.4s ease, padding 0.4s ease, border-radius 0.4s ease, box-shadow 0.4s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .puzzle-grid.solved {
      gap: 0px;
      padding: 0px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(48, 209, 88, 0.3);
    }

    .puzzle-piece {
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-radius 0.4s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
    }

    .puzzle-grid.solved .puzzle-piece {
      border-radius: 0px;
      box-shadow: none;
    }

    .puzzle-piece.selected {
      outline: 2px solid var(--accent-color);
      transform: scale(0.94);
      z-index: 2;
    }

    /* Стили для обновленной светлой игры "Собери стол" */
    .table-game-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin: 10px 0;
    }

    .table-canvas {
      width: 100%;
      height: 230px;
      background: linear-gradient(180deg, #f7f3ed 0%, #ede6db 100%);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    /* Легкая фоновая сетка чертежа */
    .table-canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(0, 0, 0, 0.06) 1px, transparent 1px);
      background-size: 16px 16px;
      pointer-events: none;
    }

    .table-part-target {
      position: absolute;
      border: 2px dashed rgba(160, 140, 120, 0.4);
      border-radius: 8px;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-sizing: border-box;
    }

    /* Установленная ножка стола (Светлое дерево) */
    .table-part-target.leg.placed {
      background: linear-gradient(90deg, #d4b08c 0%, #e6cbab 50%, #c49f7b 100%);
      border: 1px solid #b38b68;
      border-radius: 6px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    /* Установленная столешница (Светлый скандинавский дуб) */
    .table-part-target.top.placed {
      background: linear-gradient(180deg, #f0dfcc 0%, #dec4a6 100%);
      border: 1.5px solid #c4a482;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2), inset 0 1px 2px rgba(255,255,255,0.6);
    }

    .parts-inventory {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
    }

    .part-btn {
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      backdrop-filter: blur(10px);
    }

    .part-btn:active {
      transform: scale(0.95);
    }

    .part-btn.disabled {
      opacity: 0.25;
      pointer-events: none;
    }

    /* Стили для игры "Погладь Чипса" */
    .cat-pet-container {
      width: 100%;
      height: 280px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin: 12px 0;
    }

    .cat-img {
      max-width: 90%;
      max-height: 260px;
      object-fit: contain;
      cursor: pointer;
      touch-action: none;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
      transition: transform 0.1s ease;
    }

    .cat-img:active {
      transform: scale(1.03);
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="fade-wrapper" id="fadeWrapper">
    <!-- Шапка -->
    <div class="header" id="headerBlock">
      <span class="step-badge" id="stepBadge">Шаг 1 из 16</span>
      <h1 class="title" id="stepTitle">Заголовок</h1>
      <p class="description" id="stepDesc">Описание шага...</p>
    </div>

    <!-- Иллюстрация основного квеста или сертификат -->
    <div class="media-card" id="mediaCardContainer">
      <img id="stepImg" src="" alt="Иллюстрация">
    </div>

    <!-- Область для Пазла -->
    <div id="puzzleArea" style="display: none; width: 100%; margin: 12px 0;">
      <div class="puzzle-grid" id="puzzleContainer"></div>
    </div>

    <!-- Область для Мини-игры "Собери стол" -->
    <div id="tableGameArea" style="display: none; width: 100%; margin: 12px 0;">
      <div class="table-game-container">
        <div class="table-canvas">
          <div class="table-part-target top" id="target-top" style="top: 55px; left: 12%; width: 76%; height: 26px;"></div>
          <div class="table-part-target leg" id="target-leg1" style="top: 81px; left: 16%; width: 14px; height: 95px;"></div>
          <div class="table-part-target leg" id="target-leg2" style="top: 81px; left: 34%; width: 14px; height: 85px;"></div>
          <div class="table-part-target leg" id="target-leg3" style="top: 81px; left: 64%; width: 14px; height: 85px;"></div>
          <div class="table-part-target leg" id="target-leg4" style="top: 81px; left: 82%; width: 14px; height: 95px;"></div>
        </div>
        <div class="parts-inventory" id="partsInventory"></div>
      </div>
    </div>

    <!-- Область для игры "Погладь Чипса" -->
    <div id="catPetArea" style="display: none; width: 100%;">
      <div class="cat-pet-container">
        <img id="chipsCatImg" class="cat-img" src="https://i.postimg.cc/Ss6nGH7t/IMG-7720.png" alt="Кот Чипс">
      </div>
    </div>

    <!-- Область для переходного текстового экрана -->
    <div class="intro-text-block" id="introTextBlock" style="display: none;">
      <h2 id="introTextContent"></h2>
      <div id="introBtnContainer" style="width: 100%;"></div>
    </div>

    <!-- Область для финального целующего смайлика -->
    <div class="kiss-screen" id="kissScreen" style="display: none;">
      😘
    </div>

    <!-- Область Скретч-карты -->
    <div id="giftCardArea" style="display: none; width: 100%;">
      <div class="scratch-container">
        <img id="giftImg" src="" alt="Карточка" crossorigin="anonymous">
        <canvas class="scratch-canvas" id="giftCanvas"></canvas>
      </div>
    </div>

    <!-- Нижний интерактивный блок -->
    <div class="interactive-area" id="interactiveArea">
      <div class="question" id="stepQuestion">Вопрос...</div>
      <div class="options" id="optionsContainer"></div>
      <button class="next-btn" id="nextBtn" onclick="nextStep()">Продолжить ➔</button>
    </div>
  </div>
</div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  // Настройка MP3-файлов мурлыканья
  const purrAudioFiles = ['11.mp3', '22.mp3', '333.mp3'];
  const purrAudioElements = purrAudioFiles.map(src => {
    const audio = new Audio(src);
    audio.loop = true;
    return audio;
  });

  let currentPurrIndex = 0;
  let currentPurrAudio = null;
  let fadeInterval = null;
  let isInteractingWithCat = false;
  let cleanupCatEvents = null;

  // Предзагрузка аудиофайлов при первом касании
  function unlockAudio() {
    purrAudioElements.forEach(audio => {
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
      }).catch(() => {});
    });
    window.removeEventListener('touchstart', unlockAudio);
    window.removeEventListener('mousedown', unlockAudio);
  }

  window.addEventListener('touchstart', unlockAudio, { passive: true });
  window.addEventListener('mousedown', unlockAudio, { passive: true });

  // Поочередный запуск воспроизведения
  function startPurr() {
    // Воспроизводим звук ТОЛЬКО на шаге с котиком и ТОЛЬКО при активном контакте
    if (steps[currentStep] && !steps[currentStep].isCatPet) return;
    if (!isInteractingWithCat) return;

    if (fadeInterval) {
      clearInterval(fadeInterval);
      fadeInterval = null;
    }

    if (currentPurrAudio) {
      currentPurrAudio.volume = 1;
      return;
    }

    currentPurrAudio = purrAudioElements[currentPurrIndex];
    currentPurrAudio.volume = 1;
    currentPurrAudio.currentTime = 0;
    currentPurrAudio.play().catch(e => console.log('Purr play error:', e));

    currentPurrIndex = (currentPurrIndex + 1) % purrAudioElements.length;
  }

  // Остановка воспроизведения (immediate = true выключает звук моментально)
  function stopPurr(immediate = false) {
    if (fadeInterval) {
      clearInterval(fadeInterval);
      fadeInterval = null;
    }

    if (immediate) {
      purrAudioElements.forEach(audio => {
        audio.pause();
        audio.currentTime = 0;
        audio.volume = 1;
      });
      currentPurrAudio = null;
      return;
    }

    if (!currentPurrAudio) return;

    const activeAudio = currentPurrAudio;
    currentPurrAudio = null;

    const fadeDuration = 200;
    const intervalStep = 25;
    const fadeStep = activeAudio.volume / (fadeDuration / intervalStep);

    fadeInterval = setInterval(() => {
      if (activeAudio && activeAudio.volume > fadeStep) {
        activeAudio.volume -= fadeStep;
      } else {
        if (activeAudio) {
          activeAudio.volume = 0;
          activeAudio.pause();
          activeAudio.currentTime = 0;
        }
        clearInterval(fadeInterval);
        fadeInterval = null;
      }
    }, intervalStep);
  }

  // Массив всех шагов квеста
  const steps = [
    {
      isIntroText: true,

      btnText: "Начать ✨"

    {
      badge: "Шаг 1 из 16 • Уральск",

      img: "https://i.postimg.cc/RhbcQyct/IMG-7708.jpg",
      question: "Помнишь ли ты, где произошло то самое знакомство?",
      options: [
        { text: "На прогулке с общими друзьями", correct: true },
        { text: "В уютном кафе у дома", correct: false },
        { text: "Случайно на улице", correct: false }
      ]
    },
    {
      badge: "Шаг 2 из 16 • Воспоминания",
      title: "Глава 2: Вдали друг от друга",
      desc: "Учеба, ночной город и бесконечные звонки сквозь километры.",
      img: "https://i.postimg.cc/jjQPkLHr/IMG-7702.jpg",
      question: "Готовы двигаться дальше сквозь километры?",
      options: [
        { text: "Да, поехали дальше! ✨", correct: true }
      ]
    },
    {
      badge: "Шаг 3 из 16 • Расстояние",
      title: "Уфа ↔ Самара",
      desc: "",
      img: "https://i.postimg.cc/wMhrfvsp/IMG-7669.jpg",
      question: "Длина, разделявшей вас, железной дороги между Самарой и Уфой",
      options: [
        { text: "Около 420 км", correct: false },
        { text: "Примерно 530 км", correct: true },
        { text: "Больше 640 км", correct: false }
      ]
    },
    {
      badge: "Шаг 4 из 16 • Дом",
      title: "Глава 3: Вместе в Самаре",
      desc: "Конец билетам и ожиданиям! Наконец-то общий дом и тёплые вечера.",
      img: "https://i.postimg.cc/ZK289kYm/IMG-7704.jpg",
      question: "Что помогло быстрее всего обустроить ваш уют?",
      options: [
        { text: "Тёплые беседы, душевный чай и забота", correct: true },
        { text: "Бесконечные споры о бытовых мелочах", correct: false }
      ]
    },
    {
      badge: "Шаг 5 из 16 • Уют",
      title: "Тёплые моменты",
      desc: "Когда дом наполняется радостью и общими мечтами.",

    /* СТРАНИЦА "АРТЁМ, СОБЕРИ СТОЛ" */

    {

    {

    },
    {
      badge: "Шаг 8 из 16 • Праздник",
      title: "Тот самый день💍",
      desc: "Соберите пазл, чтобы восстановить самый важный кадр!",
      img: "https://i.postimg.cc/Qd3qJDDc/IMG-7670.jpg",

  let currentStep = 0;

  function triggerPopPopper() {
    confetti({ particleCount: 70, angle: 60, spread: 60, origin: { x: 0, y: 0.8 } });
    confetti({ particleCount: 70, angle: 120, spread: 60, origin: { x: 1, y: 0.8 } });
  }

  function initScratchCard(canvas, imgElement) {
    if (!canvas || !imgElement) return;
    const ctx = canvas.getContext('2d');

    const setupCanvasSize = () => {
      canvas.width = imgElement.clientWidth || 350;
      canvas.height = imgElement.clientHeight || 220;
      
      ctx.fillStyle = "#8e8e93";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 16px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("✨ Сотрите защитный слой ✨", canvas.width / 2, canvas.height / 2);
    };

    if (imgElement.complete && imgElement.naturalWidth !== 0) {
      setupCanvasSize();
    } else {
      imgElement.onload = setupCanvasSize;
    }

    let isDrawing = false;

    const getPos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    };

    const scratch = (e) => {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getPos(e);
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 28, 0, Math.PI * 2, false);
      ctx.fill();

      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) nextBtn.classList.add('visible');
    };

    canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
    canvas.addEventListener('mousemove', scratch);
    window.addEventListener('mouseup', () => { isDrawing = false; });

    canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); }, { passive: false });
    canvas.addEventListener('touchmove', scratch, { passive: false });
    window.addEventListener('touchend', () => { isDrawing = false; });
  }

  // Игра "Сборка стола"
  function initTableGame() {
    const partsContainer = document.getElementById('partsInventory');
    
    function resetTable() {
      partsContainer.innerHTML = '';
      document.querySelectorAll('.table-part-target').forEach(t => t.classList.remove('placed'));

      let parts = [
        { id: 'leg1', type: 'leg', name: 'Ножка 1 🦵', placed: false },
        { id: 'leg2', type: 'leg', name: 'Ножка 2 🦵', placed: false },
        { id: 'top', type: 'top', name: 'Столешница 🪵', placed: false },
        { id: 'leg3', type: 'leg', name: 'Ножка 3 🦵', placed: false },
        { id: 'leg4', type: 'leg', name: 'Ножка 4 🦵', placed: false }
      ];

      // Начальный случайный перемес
      parts.sort(() => Math.random() - 0.5);
      let placedLegsCount = 0;

      function renderButtons() {
        partsContainer.innerHTML = '';

        parts.forEach(part => {
          const btn = document.createElement('button');
          btn.className = 'part-btn' + (part.placed ? ' disabled' : '');
          btn.innerText = part.name;

          btn.onclick = () => {
            if (part.placed) return;

            if (part.type === 'top') {
              if (placedLegsCount < 4) {
                alert('Ошибка! Сначала нужно установить все 4 ножки, иначе стол упадет! Сборка начинается заново 🛠️');
                resetTable();
                return;
              } else {
                part.placed = true;
                const target = document.getElementById(`target-top`);
                if (target) target.classList.add('placed');
                triggerPopPopper();
                const nextBtn = document.getElementById('nextBtn');
                if (nextBtn) nextBtn.classList.add('visible');
                renderButtons();
              }
            } else {
              part.placed = true;
              const target = document.getElementById(`target-${part.id}`);
              if (target) target.classList.add('placed');
              placedLegsCount++;

              shuffleUnplacedParts();
              renderButtons();
            }
          };
          partsContainer.appendChild(btn);
        });
      }

      // Функция перемешивания, гарантирующая смену позиции столешницы
      function shuffleUnplacedParts() {
        const unplaced = parts.filter(p => !p.placed);
        if (unplaced.length <= 1) return;

        const oldTopIndex = unplaced.findIndex(p => p.type === 'top');

        let shuffled;
        do {
          shuffled = [...unplaced].sort(() => Math.random() - 0.5);
        } while (
          oldTopIndex !== -1 &&
          shuffled.length > 1 &&
          shuffled.findIndex(p => p.type === 'top') === oldTopIndex
        );

        let idx = 0;
        parts = parts.map(p => p.placed ? p : shuffled[idx++]);
      }

      renderButtons();
    }

    resetTable();
  }

  // Игра "Погладь Чипса"
  function initCatPet() {
    const catImg = document.getElementById('chipsCatImg');
    let petProgress = 0;
    isInteractingWithCat = false;

    if (cleanupCatEvents) {
      cleanupCatEvents();
    }

    const handleStart = () => {
      isInteractingWithCat = true;
      startPurr();
    };

    const handlePet = (e) => {
      if (!isInteractingWithCat) return;
      if (e.cancelable) e.preventDefault();
      startPurr();
      if (navigator.vibrate) {
        navigator.vibrate(30);
      }

      petProgress++;
      if (petProgress > 10) {
        const nextBtn = document.getElementById('nextBtn');
        if (nextBtn) nextBtn.classList.add('visible');
      }
    };

    const handleStop = () => {
      if (!isInteractingWithCat) return;
      isInteractingWithCat = false;
      stopPurr();
    };

    catImg.addEventListener('mousedown', handleStart);
    catImg.addEventListener('mousemove', handlePet);
    
    catImg.addEventListener('touchstart', handleStart, { passive: true });
    catImg.addEventListener('touchmove', handlePet, { passive: false });

    window.addEventListener('mouseup', handleStop);
    window.addEventListener('touchend', handleStop);
    window.addEventListener('touchcancel', handleStop);

    cleanupCatEvents = () => {
      catImg.removeEventListener('mousedown', handleStart);
      catImg.removeEventListener('mousemove', handlePet);
      catImg.removeEventListener('touchstart', handleStart);
      catImg.removeEventListener('touchmove', handlePet);

      window.removeEventListener('mouseup', handleStop);
      window.removeEventListener('touchend', handleStop);
      window.removeEventListener('touchcancel', handleStop);
    };
  }

  // Пазл 4x5
  function initPuzzle(imgUrl) {
    const puzzleContainer = document.getElementById('puzzleContainer');
    puzzleContainer.innerHTML = '';
    puzzleContainer.classList.remove('solved');
    
    let pieces = Array.from({ length: 20 }, (_, i) => i);
    do {
      pieces.sort(() => Math.random() - 0.5);
    } while (isPuzzleSolved(pieces));

    let selectedIndex = null;
    let isFinished = false;

    function isPuzzleSolved(arr) {
      return arr.every((val, index) => val === index);
    }

    function renderPuzzle() {
      puzzleContainer.innerHTML = '';
      const containerWidth = puzzleContainer.clientWidth || 320;
      const containerHeight = (containerWidth * 5) / 4;

      pieces.forEach((pieceIndex, currentIndex) => {
        const div = document.createElement('div');
        div.className = 'puzzle-piece';
        if (selectedIndex === currentIndex && !isFinished) div.classList.add('selected');

        const correctRow = Math.floor(pieceIndex / 4);
        const correctCol = pieceIndex % 4;

        div.style.backgroundImage = `url(${imgUrl})`;
        div.style.backgroundSize = `${containerWidth}px ${containerHeight}px`;
        div.style.backgroundPosition = `-${correctCol * (containerWidth / 4)}px -${correctRow * (containerHeight / 5)}px`;

        if (!isFinished) {
          div.onclick = () => {
            if (selectedIndex === null) {
              selectedIndex = currentIndex;
            } else if (selectedIndex === currentIndex) {
              selectedIndex = null;
            } else {
              const temp = pieces[selectedIndex];
              pieces[selectedIndex] = pieces[currentIndex];
              pieces[currentIndex] = temp;
              selectedIndex = null;

              if (isPuzzleSolved(pieces)) {
                isFinished = true;
                puzzleContainer.classList.add('solved');
                triggerPopPopper();
                const nextBtn = document.getElementById('nextBtn');
                if (nextBtn) nextBtn.classList.add('visible');
              }
            }
            renderPuzzle();
          };
        }

        puzzleContainer.appendChild(div);
      });
    }

    renderPuzzle();
  }

  function renderStep() {
    // При переключении любого шага отключаем все аудио со сбросом
    isInteractingWithCat = false;
    stopPurr(true);

    if (cleanupCatEvents) {
      cleanupCatEvents();
      cleanupCatEvents = null;
    }

    const data = steps[currentStep];

    const headerBlock = document.getElementById('headerBlock');

    document.getElementById('stepBadge').innerText = data.badge;

    if (data.isTableGame) {
      mediaCardContainer.style.display = 'none';
      puzzleArea.style.display = 'none';
      catPetArea.style.display = 'none';
      giftCardArea.style.display = 'none';
      tableGameArea.style.display = 'block';

      interactiveArea.innerHTML = `
        <button class="next-btn" id="nextBtn" onclick="nextStep()">Продолжить ➔</button>
      `;

      initTableGame();
      return;
    }

    if (data.isCatPet) {
      mediaCardContainer.style.display = 'none';
      puzzleArea.style.display = 'none';
      tableGameArea.style.display = 'none';
      giftCardArea.style.display = 'none';
      catPetArea.style.display = 'flex';

      interactiveArea.innerHTML = `
        <button class="next-btn" id="nextBtn" onclick="nextStep()">Продолжить ➔</button>
      `;

      initCatPet();
      return;
    }

    if (data.isPuzzle) {
      mediaCardContainer.style.display = 'none';
      tableGameArea.style.display = 'none';
      catPetArea.style.display = 'none';
      giftCardArea.style.display = 'none';
      puzzleArea.style.display = 'block';

      interactiveArea.innerHTML = `
        <button class="next-btn" id="nextBtn" onclick="nextStep()">Продолжить ➔</button>
      `;

      setTimeout(() => {
        initPuzzle(data.img);
      }, 50);
      return;
    }

    if (data.isScratch) {
      mediaCardContainer.style.display = 'none';
      puzzleArea.style.display = 'none';
      tableGameArea.style.display = 'none';
      catPetArea.style.display = 'none';
      giftCardArea.style.display = 'block';

      const giftImg = document.getElementById('giftImg');
      const giftCanvas = document.getElementById('giftCanvas');
      giftImg.src = data.giftImg;

      setTimeout(() => {
        initScratchCard(giftCanvas, giftImg);
      }, 50);

      interactiveArea.innerHTML = `
        <button class="next-btn" id="nextBtn" onclick="nextStep()">${data.btnText}</button>
      `;
      return;
    }

    if (data.isCertificate) {
      mediaCardContainer.style.display = 'flex';
      puzzleArea.style.display = 'none';
      tableGameArea.style.display = 'none';
      catPetArea.style.display = 'none';
      giftCardArea.style.display = 'none';
      document.getElementById('stepImg').src = data.img;

      triggerPopPopper();
      setTimeout(triggerPopPopper, 300);

      interactiveArea.innerHTML = `
        <button class="next-btn visible" id="nextBtn" onclick="nextStep()">${data.btnText}</button>
      `;
      return;
    }

    mediaCardContainer.style.display = 'flex';
    puzzleArea.style.display = 'none';
    tableGameArea.style.display = 'none';
    catPetArea.style.display = 'none';
    giftCardArea.style.display = 'none';
    document.getElementById('stepImg').src = data.img;

    interactiveArea.innerHTML = `
      <div class="question" id="stepQuestion"></div>
      <div class="options" id="optionsContainer"></div>
      <button class="next-btn" id="nextBtn" onclick="nextStep()">Продолжить ➔</button>
    `;

    document.getElementById('stepQuestion').innerText = data.question;
    const optionsContainer = document.getElementById('optionsContainer');
    const nextBtn = document.getElementById('nextBtn');

    data.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'btn-option';
      btn.innerText = opt.text;
      btn.onclick = () => {
        const allBtns = optionsContainer.querySelectorAll('.btn-option');
        allBtns.forEach(b => b.disabled = true);
        
        if (opt.correct) {
          btn.classList.add('correct');
        } else {
          btn.classList.add('wrong');
        }
        nextBtn.classList.add('visible');
      };
      optionsContainer.appendChild(btn);
    });
  }

  function nextStep() {
    isInteractingWithCat = false;
    stopPurr(true);
    if (currentStep < steps.length - 1) {
      const wrapper = document.getElementById('fadeWrapper');
      wrapper.classList.add('fade-out');
      
      setTimeout(() => {
        currentStep++;
        renderStep();
        wrapper.classList.remove('fade-out');
      }, 350);

      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.close();
      } else {
        alert("Поздравляем! Все сертификаты успешно открыты 🎉");
      }
    }
  }
