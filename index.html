<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Свадебный Квест</title>
  <!-- Telegram Web App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- библиотека Конфетти -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: rgba(28, 28, 30, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f5f5f7;
      --text-secondary: #8e8e93;
      --accent-color: #0a84ff;
      --success-bg: rgba(48, 209, 88, 0.15);
      --success-border: #30d158;
      --success-text: #30d158;
      --error-bg: rgba(255, 69, 58, 0.15);
      --error-border: #ff453a;
      --error-text: #ff453a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Мобильный контейнер / Карточка */
    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100dvh;
      max-height: 880px;
      padding: 16px 20px 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Верхний инфо-блок */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .step-badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .description {
      font-size: 13px;
      line-height: 1.35;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* Фотография с размытием в стиле iOS */
    .media-card {
      width: 100%;
      flex: 1;
      max-height: 260px;
      min-height: 180px;
      margin: 14px 0;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      background: #1c1c1e;
      border: 1px solid var(--card-border);
    }

    .media-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    /* Нижний интерактивный блок */
    .interactive-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .question {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 2px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Кнопки ответов Apple style */
    .btn-option {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .btn-option:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.12);
    }

    .btn-option.correct {
      background: var(--success-bg) !important;
      border-color: var(--success-border) !important;
      color: var(--success-text) !important;
      font-weight: 600;
    }

    .btn-option.wrong {
      background: var(--error-bg) !important;
      border-color: var(--error-border) !important;
      color: var(--error-text) !important;
    }

    /* Синяя кнопка Apple дальше */
    .next-btn {
      width: 100%;
      padding: 15px;
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px) scale(0.96);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 4px;
    }

    .next-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .next-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    /* Плавная анимация смены шагов */
    .fade-wrapper {
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.35s cubic-bezier(0.25, 1, 0.5, 1), transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
    }

    .fade-out {
      opacity: 0;
      transform: scale(0.96);
    }

    /* Подарок / QR код в финале */
    .qr-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      border: 1px dashed rgba(48, 209, 88, 0.4);
    }

    .qr-box img {
      width: 160px;
      height: 160px;
      border-radius: 12px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="fade-wrapper" id="fadeWrapper">
    <!-- Шапка -->
    <div class="header">
      <span class="step-badge" id="stepBadge">Шаг 1 из 7</span>
      <h1 class="title" id="stepTitle">Встреча в Уральске</h1>
      <p class="description" id="stepDesc">С этого места началась история любви...</p>
    </div>

    <!-- Картинка -->
    <div class="media-card">
      <img id="stepImg" src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=800" alt="Арт страницы">
    </div>

    <!-- Вопрос и ответы -->
    <div class="interactive-area">
      <div class="question" id="stepQuestion">Вопрос...</div>
      <div class="options" id="optionsContainer"></div>
      <button class="next-btn" id="nextBtn" onclick="nextStep()">Продолжить ➔</button>
    </div>
  </div>
</div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  const steps = [
    {
      badge: "Шаг 1 из 7 • Уральск",
      title: "Глава 1: Первое чувство",
      desc: "Уральск. Город, где пересеклись две жизненные орбиты.",
      img: "https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=800",
      question: "Помнишь ли ты, где произошло то самое знакомство?",
      options: [
        { text: "На прогулке с общими друзьями", correct: true },
        { text: "В уютном кафе у дома", correct: false },
        { text: "Случайно на улице", correct: false }
      ]
    },
    {
      badge: "Шаг 2 из 7 • Расстояние",
      title: "Глава 2: Уфа ↔ Самара",
      desc: "Учеба в УГНТУ и учеба в Самаре. Бесконечные звонки и ожидание встреч.",
      img: "https://images.unsplash.com/photo-1474487548417-781cb71495f3?w=800",
      question: "Сколько примерно километров соединяло ваши города?",
      options: [
        { text: "Около 250 км", correct: false },
        { text: "Примерно 460 км", correct: true },
        { text: "Больше 800 км", correct: false }
      ]
    },
    {
      badge: "Шаг 3 из 7 • Дом",
      title: "Глава 3: Вместе в Самаре",
      desc: "Конец билетам и ожиданию! Наконец-то один город и общий уют.",
      img: "https://images.unsplash.com/photo-1513694203232-719a280e022f?w=800",
      question: "Что помогло быстрее всего обустроить ваш быт?",
      options: [
        { text: "Пицца по пятницам и тёплые беседы", correct: true },
        { text: "Споры о том, кто сегодня моет посуду", correct: false }
      ]
    },
    {
      badge: "Шаг 4 из 7 • Манила",
      title: "Глава 4: Филиппины & «ДА!»",
      desc: "Тропический закат, океан и тот самый важный шаг 💍",
      img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800",
      question: "Какая атмосфера царила в тот незабываемый момент?",
      options: [
        { text: "Сказочный романтический закат", correct: true },
        { text: "Полный экспромт и легкое волнение", correct: true }
      ]
    },
    {
      badge: "Шаг 5 из 7 • Алматы",
      title: "Глава 5: В горах с друзьями",
      desc: "Заснеженные вершины, горный воздух и лучшая компания!",
      img: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800",
      question: "Главный ингредиент идеального похода в горы?",
      options: [
        { text: "Надежные друзья и море юмора", correct: true }
      ]
    },
    {
      badge: "Шаг 6 из 7 • Праздник",
      title: "Глава 6: День Свадьбы 🍾",
      desc: "День рождения новой семьи! Пусть жизнь будет яркой!",
      img: "https://images.unsplash.com/photo-1519741497674-611481863552?w=800",
      question: "Что кричим прямо сейчас?",
      options: [
        { text: "ГОРЬКО! 🎉", correct: true }
      ]
    },
    {
      badge: "Шаг 7 из 7 • Финал",
      title: "Главный подарок! 🎁",
      desc: "Вы прошли весь путь! Пора как следует отдохнуть на лоне природы.",
      img: "https://images.unsplash.com/photo-1510312305653-8ed496efae75?w=800",
      isFinal: true
    }
  ];

  let currentStep = 0;

  function renderStep() {
    const data = steps[currentStep];
    document.getElementById('stepBadge').innerText = data.badge;
    document.getElementById('stepTitle').innerText = data.title;
    document.getElementById('stepDesc').innerText = data.desc;
    document.getElementById('stepImg').src = data.img;
    
    const optionsContainer = document.getElementById('optionsContainer');
    const questionEl = document.getElementById('stepQuestion');
    const nextBtn = document.getElementById('nextBtn');
    
    optionsContainer.innerHTML = '';
    nextBtn.classList.remove('visible');

    if (data.isFinal) {
      questionEl.innerHTML = `
        <div class="qr-box">
          <p style="font-size:13px; font-weight:600; color: var(--success-text);">Ваш сертификат в глэмпинг:</p>
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://example.com" alt="QR-код">
        </div>`;
      confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
      return;
    }

    questionEl.innerText = data.question;

    data.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'btn-option';
      btn.innerText = opt.text;
      btn.onclick = () => {
        const allBtns = optionsContainer.querySelectorAll('.btn-option');
        allBtns.forEach(b => b.disabled = true);
        
        if (opt.correct) {
          btn.classList.add('correct');
        } else {
          btn.classList.add('wrong');
        }
        nextBtn.classList.add('visible');
      };
      optionsContainer.appendChild(btn);
    });
  }

  function nextStep() {
    if (currentStep < steps.length - 1) {
      const wrapper = document.getElementById('fadeWrapper');
      wrapper.classList.add('fade-out');
      
      setTimeout(() => {
        currentStep++;
        renderStep();
        wrapper.classList.remove('fade-out');
      }, 350);
    }
  }

  renderStep();
</script>
</body>
</html>
