<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Свадебный Квест</title>
  <!-- Telegram Web App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- библиотека Конфетти (хлопушка) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: rgba(28, 28, 30, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f5f5f7;
      --text-secondary: #8e8e93;
      --accent-color: #0a84ff;
      --success-bg: rgba(48, 209, 88, 0.15);
      --success-border: #30d158;
      --success-text: #30d158;
      --error-bg: rgba(255, 69, 58, 0.15);
      --error-border: #ff453a;
      --error-text: #ff453a;
      --gold-accent: #d4af37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      min-height: 100dvh;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Мобильный контейнер */
    .app-container {
      width: 100%;
      max-width: 420px;
      min-height: 100dvh;
      padding: 16px 20px 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Верхний инфо-блок */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .step-badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .description {
      font-size: 13px;
      line-height: 1.35;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* Карточка с иллюстрацией (Квест и Четкие сертификаты) */
    .media-card {
      width: 100%;
      flex: 1;
      max-height: 280px;
      min-height: 180px;
      margin: 12px 0;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      background: #1c1c1e;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .media-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Нижний интерактивный блок */
    .interactive-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .question {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 2px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Кнопки ответов */
    .btn-option {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-option:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.12);
    }

    .btn-option.correct {
      background: var(--success-bg) !important;
      border-color: var(--success-border) !important;
      color: var(--success-text) !important;
      font-weight: 600;
    }

    .btn-option.wrong {
      background: var(--error-bg) !important;
      border-color: var(--error-border) !important;
      color: var(--error-text) !important;
    }

    /* Синяя главная кнопка */
    .next-btn {
      width: 100%;
      padding: 15px;
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px) scale(0.96);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 4px;
    }

    .next-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .next-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    /* Анимация смены кадров */
    .fade-wrapper {
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.35s ease, transform 0.35s ease;
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
    }

    .fade-out {
      opacity: 0;
      transform: scale(0.96);
    }

    /* Стили для скретч-карты */
    .scratch-container {
      position: relative;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      background: #18181a;
      margin: 12px 0;
    }

    .scratch-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .scratch-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: none;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="fade-wrapper" id="fadeWrapper">
    <!-- Шапка -->
    <div class="header">
      <span class="step-badge" id="stepBadge">Шаг 1 из 12</span>
      <h1 class="title" id="stepTitle">Заголовок</h1>
      <p class="description" id="stepDesc">Описание шага...</p>
    </div>

    <!-- Иллюстрация основного квеста или четкого сертификата -->
    <div class="media-card" id="mediaCardContainer">
      <img id="stepImg" src="" alt="Иллюстрация">
    </div>

    <!-- Область Скретч-карты -->
    <div id="giftCardArea" style="display: none; width: 100%;">
      <div class="scratch-container">
        <img id="giftImg" src="" alt="Карточка" crossorigin="anonymous">
        <canvas class="scratch-canvas" id="giftCanvas"></canvas>
      </div>
    </div>

    <!-- Нижний интерактивный блок -->
    <div class="interactive-area" id="interactiveArea">
      <div class="question" id="stepQuestion">Вопрос...</div>
      <div class="options" id="optionsContainer"></div>
      <button class="next-btn" id="nextBtn" onclick="nextStep()">Продолжить ➔</button>
    </div>
  </div>
</div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  // Массив всех шагов: Квест -> Подарок 1 (Скретч) -> Сертификат 1 -> Подарок 2 (Скретч) -> Сертификат 2 -> Подарок 3 (Скретч) -> Сертификат 3
  const steps = [
    {
      badge: "Шаг 1 из 12 • Уральск",
      title: "Глава 1: Первое чувство",
      desc: "Уральск. Город, где пересеклись два жизненных пути.",
      img: "https://images.unsplash.com/photo-1514565131-fce0801e5785?w=800&auto=format&fit=crop",
      question: "Помнишь ли ты, где произошло то самое знакомство?",
      options: [
        { text: "На прогулке с общими друзьями", correct: true },
        { text: "В уютном кафе у дома", correct: false },
        { text: "Случайно на улице", correct: false }
      ]
    },
    {
      badge: "Шаг 2 из 12 • Расстояние",
      title: "Глава 2: Уфа ↔ Самара",
      desc: "Учеба, ночной город и бесконечные звонки сквозь километры.",
      img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800&auto=format&fit=crop",
      question: "Сколько примерно километров соединяло ваши города?",
      options: [
        { text: "Около 250 км", correct: false },
        { text: "Примерно 460 км", correct: true },
        { text: "Больше 800 км", correct: false }
      ]
    },
    {
      badge: "Шаг 3 из 12 • Дом",
      title: "Глава 3: Вместе в Самаре",
      desc: "Конец билетам и ожиданиям! Наконец-то общий дом и тёплые вечера.",
      img: "https://images.unsplash.com/photo-1540555700478-4be289fbecef?w=800&auto=format&fit=crop",
      question: "Что помогло быстрее всего обустроить ваш уют?",
      options: [
        { text: "Тёплые беседы, душевный чай и забота", correct: true },
        { text: "Бесконечные споры о бытовых мелочах", correct: false }
      ]
    },
    {
      badge: "Шаг 4 из 12 • Манила",
      title: "Глава 4: Филиппины & «ДА!»",
      desc: "Ночной океан, звездное небо и самый важный ответ 💍",
      img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&auto=format&fit=crop",
      question: "Какая атмосфера царила в тот незабываемый момент?",
      options: [
        { text: "Волшебный закат и полная гармония", correct: true },
        { text: "Легкий экспромт и океан эмоций", correct: true }
      ]
    },
    {
      badge: "Шаг 5 из 12 • Алматы",
      title: "Глава 5: В горах с друзьями",
      desc: "Вечерний костер, тишина гор и лучшая компания рядом.",
      img: "https://images.unsplash.com/photo-1478131143081-80f7f84ca84d?w=800&auto=format&fit=crop",
      question: "Главный ингредиент идеального похода в горы?",
      options: [
        { text: "Надежные друзья и уют у огня", correct: true }
      ]
    },
    {
      badge: "Шаг 6 из 12 • Праздник",
      title: "Глава 6: День Свадьбы 🥂",
      desc: "Рождение новой семьи при свете сотен огней!",
      img: "https://images.unsplash.com/photo-1519741497674-611481863552?w=800&auto=format&fit=crop",
      question: "Что кричим молодоженам прямо сейчас?",
      options: [
        { text: "ГОРЬКО! 🎉", correct: true }
      ]
    },

    /* ПОДАРКИ И СЕРТИФИКАТЫ */
    
    // Подарок 1: Люмисфера (Скретч)
    {
      badge: "Подарок 1 из 3 🎁",
      title: "Красивой музыкой ✨",
      desc: "Сотрите защитный слой, чтобы открыть тайный подарок!",
      giftImg: "https://i.postimg.cc/PxkGRT9n/IMG-7621.jpg",
      isScratch: true,
      btnText: "Получить сертификат 🎟️"
    },
    // Сертификат 1: Люмисфера (Чистый + Хлопушка)
    {
      badge: "Ваш Сертификат 🎁",
      title: "Концерт Люмисфера 🎻",
      desc: "Ваш билет на незабываемый музыкальный вечер!",
      img: "https://i.postimg.cc/rsYDMJDZ/IMG-7441.jpg",
      isCertificate: true,
      btnText: "Следующий подарок ➔"
    },

    // Подарок 2: Аквариум (Скретч)
    {
      badge: "Подарок 2 из 3 🎁",
      title: "Вкусной едой 🍽️",
      desc: "Сотрите защитный слой, чтобы узнать следующий сюрприз!",
      giftImg: "https://i.postimg.cc/pV1r9sdz/IMG-7558.jpg",
      isScratch: true,
      btnText: "Получить сертификат 🎟️"
    },
    // Сертификат 2: Кулинарный мастер-класс (Чистый + Хлопушка)
    {
      badge: "Ваш Сертификат 🎁",
      title: "Кулинарный мастер-класс 🍳",
      desc: "Сертификат на совместный гастрономический вечер!",
      img: "https://images.unsplash.com/photo-1556910103-1c02745aae4d?w=800&auto=format&fit=crop", // Временная заглушка
      isCertificate: true,
      btnText: "Третий подарок ➔"
    },

    // Подарок 3: Глэмпинг (Скретч)
    {
      badge: "Подарок 3 из 3 🎁",
      title: "И прекрасной природой 🌲",
      desc: "Сотрите защитный слой для раскрытия финального подарка!",
      giftImg: "https://i.postimg.cc/q7LMpLY4/IMG-7568.jpg",
      isScratch: true,
      btnText: "Получить сертификат 🎟️"
    },
    // Сертификат 3: Глэмпинг (Чистый + Хлопушка + Финал)
    {
      badge: "Финальный Сертификат 🎁",
      title: "Отдых в Глэмпинге ⛺",
      desc: "Незабываемые выходные наедине с природой!",
      img: "https://images.unsplash.com/photo-1537225228614-56cc3556d7ed?w=800&auto=format&fit=crop", // Временная заглушка
      isCertificate: true,
      isFinalStep: true,
      btnText: "Завершить квест 🥂"
    }
  ];

  let currentStep = 0;

  // Функция салюта/конфетти
  function triggerPopPopper() {
    confetti({ particleCount: 70, angle: 60, spread: 60, origin: { x: 0, y: 0.8 } });
    confetti({ particleCount: 70, angle: 120, spread: 60, origin: { x: 1, y: 0.8 } });
  }

  // Функция настройки скретч-карты
  function initScratchCard(canvas, imgElement) {
    if (!canvas || !imgElement) return;
    const ctx = canvas.getContext('2d');

    let scratchedPixels = 0;
    let totalPixels = 0;

    const setupCanvasSize = () => {
      canvas.width = imgElement.clientWidth || 350;
      canvas.height = imgElement.clientHeight || 220;
      
      ctx.fillStyle = "#8e8e93";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 16px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("✨ Сотрите защитный слой ✨", canvas.width / 2, canvas.height / 2);

      totalPixels = canvas.width * canvas.height;
    };

    if (imgElement.complete && imgElement.naturalWidth !== 0) {
      setupCanvasSize();
    } else {
      imgElement.onload = setupCanvasSize;
    }

    let isDrawing = false;

    const getPos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    };

    const scratch = (e) => {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getPos(e);
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 28, 0, Math.PI * 2, false);
      ctx.fill();

      // Показываем кнопку получения сертификата сразу как только начали стирать
      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) nextBtn.classList.add('visible');
    };

    canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
    canvas.addEventListener('mousemove', scratch);
    window.addEventListener('mouseup', () => { isDrawing = false; });

    canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); }, { passive: false });
    canvas.addEventListener('touchmove', scratch, { passive: false });
    window.addEventListener('touchend', () => { isDrawing = false; });
  }

  function renderStep() {
    const data = steps[currentStep];
    document.getElementById('stepBadge').innerText = data.badge;
    document.getElementById('stepTitle').innerText = data.title;
    document.getElementById('stepDesc').innerText = data.desc;

    const mediaCardContainer = document.getElementById('mediaCardContainer');
    const giftCardArea = document.getElementById('giftCardArea');
    const interactiveArea = document.getElementById('interactiveArea');

    // 1. РЕЖИМ СКРЕТЧ-КАРТОЧКИ (Картинка под слоем)
    if (data.isScratch) {
      mediaCardContainer.style.display = 'none';
      giftCardArea.style.display = 'block';

      const giftImg = document.getElementById('giftImg');
      const giftCanvas = document.getElementById('giftCanvas');
      giftImg.src = data.giftImg;

      setTimeout(() => {
        initScratchCard(giftCanvas, giftImg);
      }, 50);

      interactiveArea.innerHTML = `
        <button class="next-btn" id="nextBtn" onclick="nextStep()">${data.btnText}</button>
      `;
      return;
    }

    // 2. РЕЖИМ СЕРТИФИКАТА (Чистая картинка + Хлопушка)
    if (data.isCertificate) {
      mediaCardContainer.style.display = 'block';
      giftCardArea.style.display = 'none';
      document.getElementById('stepImg').src = data.img;

      // Запуск конфетти при открытии сертификата
      triggerPopPopper();
      setTimeout(triggerPopPopper, 300);

      interactiveArea.innerHTML = `
        <button class="next-btn visible" id="nextBtn" onclick="nextStep()">${data.btnText}</button>
      `;
      return;
    }

    // 3. ОБЫЧНЫЕ ШАГИ КВЕСТА С ВОПРОСАМИ
    mediaCardContainer.style.display = 'block';
    giftCardArea.style.display = 'none';
    document.getElementById('stepImg').src = data.img;

    interactiveArea.innerHTML = `
      <div class="question" id="stepQuestion"></div>
      <div class="options" id="optionsContainer"></div>
      <button class="next-btn" id="nextBtn" onclick="nextStep()">Продолжить ➔</button>
    `;

    document.getElementById('stepQuestion').innerText = data.question;
    const optionsContainer = document.getElementById('optionsContainer');
    const nextBtn = document.getElementById('nextBtn');

    data.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'btn-option';
      btn.innerText = opt.text;
      btn.onclick = () => {
        const allBtns = optionsContainer.querySelectorAll('.btn-option');
        allBtns.forEach(b => b.disabled = true);
        
        if (opt.correct) {
          btn.classList.add('correct');
        } else {
          btn.classList.add('wrong');
        }
        nextBtn.classList.add('visible');
      };
      optionsContainer.appendChild(btn);
    });
  }

  function nextStep() {
    if (currentStep < steps.length - 1) {
      const wrapper = document.getElementById('fadeWrapper');
      wrapper.classList.add('fade-out');
      
      setTimeout(() => {
        currentStep++;
        renderStep();
        wrapper.classList.remove('fade-out');
      }, 350);
    } else {
      // Финал
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.close();
      } else {
        alert("Поздравляем! Все сертификаты успешно открыты 🎉");
      }
    }
  }

  renderStep();
</script>
</body>
</html>
